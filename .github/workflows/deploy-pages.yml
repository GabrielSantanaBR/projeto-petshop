name: Deploy Pata & Companhia to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-custom
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # Enquanto o repositório continuar configurado em Settings > Pages
      # como "Deploy from a branch", o GitHub dispara também o workflow
      # automático de Pages. Esperamos ele terminar para que este deploy do
      # build do Vite seja o último e não seja sobrescrito pelo código-fonte.
      - name: Wait for branch Pages deployment
        run: sleep 100

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
